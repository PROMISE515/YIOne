name: Build YIOne static site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
        env:
          GITHUB_PAGES_BASE: /YIOne-pages/
      - uses: actions/upload-artifact@v4
        with:
          name: yione-pages-dist
          path: dist
